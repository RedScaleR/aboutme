<!doctype html>
<html lang="en" data-theme="dark" data-bg="aurora" data-font="modern" data-card="glass" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedScaleR</title>
  <meta name="description" content="developer · creator · always learning. come say hi ✦">
  <meta name="theme-color" content="#ff3b5c">

  <!-- Link preview (Discord, Twitter, etc.). Previews don't run JavaScript,
       so these can't come from config.js. Edit them here. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RedScaleR">
  <meta property="og:title" content="RedScaleR ✦">
  <meta property="og:description" content="developer · creator · always learning. come say hi ♡">
  <meta property="og:url" content="https://redscaler.github.io/aboutme/">
  <meta property="og:image" content="https://redscaler.github.io/aboutme/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" id="favicon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Pixelify+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script>
    /* pick light/dark before first paint so there's no flash */
    (function () {
      try {
        var t = Object.assign({}, (window.SITE_CONFIG || {}).theme, JSON.parse(localStorage.getItem("aboutme:theme") || "{}"));
        var dark = t.mode === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches : t.mode !== "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- background layers -->
  <div class="bg" aria-hidden="true">
    <div class="bg-img"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grid-bg"></div>
    <canvas id="fx"></canvas>
    <div class="glow" id="glow"></div>
    <div class="grain"></div>
  </div>

  <!-- optional "click to enter" screen -->
  <div class="enter" id="enter" role="button" tabindex="0" hidden><span id="enterText"></span></div>

  <main class="stage">
    <div class="card-wrap" id="cardWrap">
      <article class="card" id="card">
        <div class="banner" id="banner"></div>

        <div class="card-body">
          <div class="head">
            <div class="avatar-wrap">
              <div class="avatar" id="avatar"></div>
              <span class="status" id="status" role="img"></span>
            </div>
            <div class="badges" id="badges"></div>
          </div>

          <h1 class="name rise" id="name" style="--d:.1s"></h1>
          <div class="handle-row rise" style="--d:.15s">
            <span id="username"></span>
            <span class="pronouns" id="pronouns"></span>
          </div>
          <p class="role rise" id="roleLine" style="--d:.2s"><span class="typed" id="typed"></span><span class="caret" aria-hidden="true"></span></p>

          <div class="inner rise" id="inner" style="--d:.25s">
            <section class="block" id="aboutBlock">
              <h2>About me</h2>
              <p id="bio"></p>
            </section>
            <section class="block" id="nowBlock">
              <h2>Right now</h2>
              <ul class="now" id="now"></ul>
            </section>
            <section class="block" id="likesBlock">
              <h2>I like</h2>
              <ul class="chips" id="likes"></ul>
            </section>
          </div>

          <div class="player rise" id="player" style="--d:.3s">
            <button class="play" id="playBtn" aria-label="Play music">
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
            </button>
            <div class="track">
              <div class="track-title"><span id="trackTitle"></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></div>
              <div class="track-artist" id="trackArtist"></div>
              <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
            </div>
          </div>

          <nav class="links rise" id="links" style="--d:.35s" aria-label="Links"></nav>
          <div class="socials rise" id="socials" style="--d:.4s"></div>
        </div>
      </article>
    </div>
    <p class="footer" id="footer"></p>
  </main>

  <!-- CUSTOMIZER -->
  <button class="fab" id="fab" aria-label="Customize the look" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2z"/></svg>
  </button>

  <aside class="panel" id="panel" role="dialog" aria-label="Customize the look">
    <div class="panel-head">
      <h3>Make it yours ✦</h3>
      <button class="icon-btn sm" id="panelClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="field">
      <span class="field-label">Accent color</span>
      <div class="swatches">
        <button class="swatch" style="--c:#ff3b5c" data-set="accent:#ff3b5c" aria-label="Crimson" title="Crimson"></button>
        <button class="swatch" style="--c:#ff6a3d" data-set="accent:#ff6a3d" aria-label="Sunset" title="Sunset"></button>
        <button class="swatch" style="--c:#f5a524" data-set="accent:#f5a524" aria-label="Gold" title="Gold"></button>
        <button class="swatch" style="--c:#10c9a0" data-set="accent:#10c9a0" aria-label="Mint" title="Mint"></button>
        <button class="swatch" style="--c:#3b9cff" data-set="accent:#3b9cff" aria-label="Sky" title="Sky"></button>
        <button class="swatch" style="--c:#8b5cf6" data-set="accent:#8b5cf6" aria-label="Violet" title="Violet"></button>
        <button class="swatch" style="--c:#f0529c" data-set="accent:#f0529c" aria-label="Rose" title="Rose"></button>
        <label class="swatch custom" title="Pick any color" id="customSwatch">
          <input type="color" id="customColor" aria-label="Custom accent color">
        </label>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Mode</span>
      <div class="seg">
        <button data-set="mode:dark">Dark</button>
        <button data-set="mode:light">Light</button>
        <button data-set="mode:auto">Auto</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Background</span>
      <div class="seg grid3">
        <button data-set="background:aurora">Aurora</button>
        <button data-set="background:stars">Stars</button>
        <button data-set="background:hearts">Hearts</button>
        <button data-set="background:grid">Grid</button>
        <button data-set="background:plain">Plain</button>
      </div>
      <input class="text-input" type="url" id="bgImage" placeholder="…or paste an image / gif link" spellcheck="false">
    </div>

    <div class="field">
      <span class="field-label">Font</span>
      <div class="seg grid3">
        <button data-set="font:modern" style="font-family:Inter,sans-serif">Modern</button>
        <button data-set="font:cute" style="font-family:Fredoka,sans-serif">Cute</button>
        <button data-set="font:pixel" style="font-family:'Pixelify Sans',monospace">Pixel</button>
        <button data-set="font:serif" style="font-family:'Playfair Display',serif">Serif</button>
        <button data-set="font:mono" style="font-family:'JetBrains Mono',monospace">Mono</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Card</span>
      <div class="seg">
        <button data-set="card:glass">Glass</button>
        <button data-set="card:solid">Solid</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="radius">Roundness <output id="radiusVal"></output></label>
      <input type="range" id="radius" min="0" max="32" step="1">
    </div>

    <label class="field switch-row">
      <span class="field-label">Sparkle cursor</span>
      <input type="checkbox" class="switch" id="sparkles">
    </label>
    <label class="field switch-row">
      <span class="field-label">Animations</span>
      <input type="checkbox" class="switch" id="motion">
    </label>

    <div class="panel-actions">
      <button class="btn btn-ghost" id="resetTheme">Reset</button>
      <button class="btn btn-primary" id="copyTheme">Copy config</button>
    </div>
    <p class="panel-note">Your picks are saved in this browser. Hit <b>Copy config</b> and paste it over the <code>theme</code> block in <code>config.js</code> to make it the default for everyone.</p>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
